name: Kanban - issue affectée et tests

on:
  issues:
    types: [assigned]          # déclenché quand une issue est affectée
  push:                        # déclenché à chaque push (pour "test #N")

env:
  GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
  OWNER: "@me"                 # le propriétaire du jeton (votre compte)
  PROJECT_NUMBER: 5            # ⚠️ remplacer par le numéro de VOTRE projet

jobs:
  en-cours:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    env:
      ISSUE_URL: ${{ github.event.issue.html_url }}
    steps:
      - name: Déplacer la carte dans In Progress
        run: |
          # 0. Vérifier le jeton : affiche ses permissions ou l'erreur exacte
          echo "Permissions du jeton :"
          gh api -i user | grep -i '^x-oauth-scopes'

          # 1. Identifiant interne du projet
          PROJECT_ID=$(gh project view "$PROJECT_NUMBER" --owner "$OWNER" --format json --jq .id)

          # 2. Identifiants du champ Status et de la colonne In Progress
          FIELD_ID=$(gh project field-list "$PROJECT_NUMBER" --owner "$OWNER" --format json \
            --jq '.fields[] | select(.name=="Status") | .id')
          OPTION_ID=$(gh project field-list "$PROJECT_NUMBER" --owner "$OWNER" --format json \
            --jq '.fields[] | select(.name=="Status") | .options[] | select(.name=="In Progress") | .id')

          # 3. Carte de l'issue (l'ajoute au projet si elle n'y est pas encore)
          ITEM_ID=$(gh project item-add "$PROJECT_NUMBER" --owner "$OWNER" --url "$ISSUE_URL" --format json --jq .id)

          # 4. Déplacement de la carte
          gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
            --field-id "$FIELD_ID" --single-select-option-id "$OPTION_ID"

  en-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      COMMITS: ${{ toJson(github.event.commits) }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - name: Déplacer les cartes "test #N" dans In Test
        run: |
          # 1. Numéros d'issues cités sous la forme "test #N" dans les commits du push
          NUMBERS=$(echo "$COMMITS" | jq -r '.[].message' \
            | grep -oiE 'test #[0-9]+' | grep -oE '[0-9]+' | sort -u || true)

          if [ -z "$NUMBERS" ]; then
            echo "Aucun 'test #N' dans les messages de commit : rien à déplacer."
            exit 0
          fi

          # 2. Identifiants du projet, du champ Status et de la colonne In Test
          PROJECT_ID=$(gh project view "$PROJECT_NUMBER" --owner "$OWNER" --format json --jq .id)
          FIELD_ID=$(gh project field-list "$PROJECT_NUMBER" --owner "$OWNER" --format json \
            --jq '.fields[] | select(.name=="Status") | .id')
          OPTION_ID=$(gh project field-list "$PROJECT_NUMBER" --owner "$OWNER" --format json \
            --jq '.fields[] | select(.name=="Status") | .options[] | select(.name=="In Test") | .id')

          # 3. Pour chaque issue citée : récupérer sa carte et la déplacer
          for N in $NUMBERS; do
            ITEM_ID=$(gh project item-add "$PROJECT_NUMBER" --owner "$OWNER" \
              --url "$REPO_URL/issues/$N" --format json --jq .id)
            gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
              --field-id "$FIELD_ID" --single-select-option-id "$OPTION_ID"
            echo "Issue #$N déplacée dans In Test"
          done
